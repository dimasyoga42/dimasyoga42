name: Waka Readme

on:
  schedule:
    # Runs automatically at 12:00 AM UTC every day
    - cron: '0 0 * * *'
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with WakaTime Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Waka Readme Action
        uses: athul/waka-readme@master
        with:
          # REQUIRED: The secret you saved in Repo Settings > Secrets
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          
          # REQUIRED: GitHub Token to commit changes (default provided by GitHub)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # OPTIONAL CONFIGURATION (Adjust as needed)
          SHOW_TITLE: true
          SECTION_NAME: waka            # The comment in your README to find BLOCKS: ⣀⣄⣤⣦⣶⣷⣿       # Visual style for the graph
          TIME_RANGE: last_7_days       # Options: last_7_days, last_30_days, last_6_months, last_year, all_time
          LANG_COUNT: 10                # Number of languages to display
          SHOW_TIME: true               # Show the time spent
          SHOW_TOTAL: true              # Show total coding time
          SHOW_MASKED_TIME: false       # Set to true to hide specific time values
