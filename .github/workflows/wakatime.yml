name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest

    steps:
      - name: Update README with WakaTime stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ===== DISPLAY SETTINGS =====
          SHOW_TITLE: false
          SECTION_NAME: waka
          CODE_LANG: txt

          # ===== DATA SETTINGS =====
          TIME_RANGE: last_7_days
          LANG_COUNT: 5

          # ===== VISIBILITY =====
          SHOW_TIME: true
          SHOW_TOTAL: false
          SHOW_MASKED_TIME: false
          STOP_AT_OTHER: false
